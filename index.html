<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Office</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b1020; color: #e5e7eb; font: 13px/1.4 ui-monospace, Consolas, monospace; display: flex; height: 100vh; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid #1f2937; }
  header h1 { font-size: 15px; margin: 0; letter-spacing: 1px; }
  #conn { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #7f1d1d; }
  #conn.on { background: #14532d; }
  .stage { flex: 1; overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 12px; }
  canvas { image-rendering: pixelated; max-width: 100%; height: auto; }
  aside { width: 300px; border-left: 1px solid #1f2937; display: flex; flex-direction: column; }
  aside h2 { font-size: 13px; margin: 0; padding: 10px 12px; border-bottom: 1px solid #1f2937; }
  #log { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  #log li { padding: 6px 12px; border-bottom: 1px solid #111827; }
  #log .time { color: #6b7280; margin-right: 6px; }
  #log .who { font-weight: bold; margin-right: 6px; }
  @media (max-width: 900px) { aside { display: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>AGENT OFFICE</h1>
    <span id="conn">disconnected</span>
  </header>
  <div class="stage"><canvas id="office"></canvas></div>
</main>
<aside>
  <h2>Activity</h2>
  <ul id="log"></ul>
</aside>
<script>
'use strict';

const ROLES = {
  'main':                   { label: 'Main Session',     color: '#e5e7eb', hair: '#3f2a1d', skin: '#f1c27d' },
  'product-manager':        { label: 'Product Manager',  color: '#f59e0b', hair: '#111827', skin: '#e0ac69' },
  'lead-business-analyst':  { label: 'Business Analyst', color: '#14b8a6', hair: '#7c2d12', skin: '#ffdbac' },
  'lead-solution-engineer': { label: 'Solution Eng',     color: '#6366f1', hair: '#1f2937', skin: '#c68642' },
  'lead-software-engineer': { label: 'Lead SWE',         color: '#3b82f6', hair: '#0f172a', skin: '#f1c27d' },
  'lead-ui':                { label: 'Lead UI',          color: '#ec4899', hair: '#a16207', skin: '#ffdbac' },
  'lead-qa':                { label: 'Lead QA',          color: '#22c55e', hair: '#451a03', skin: '#8d5524' },
  'lead-security':          { label: 'Lead Security',    color: '#ef4444', hair: '#111827', skin: '#e0ac69' },
  'lead-dba':               { label: 'Lead DBA',         color: '#a855f7', hair: '#57534e', skin: '#c68642' },
  'lead-devops':            { label: 'Lead DevOps',      color: '#0ea5e9', hair: '#292524', skin: '#f1c27d' },
};
const GUEST = { color: '#9ca3af', hair: '#4b5563', skin: '#d6b38a' };
const STATUS_COLOR = { working: '#60a5fa', waiting: '#fbbf24', done: '#4ade80', idle: '#374151' };

const COLS = 5, CW = 220, CH = 200;
const canvas = document.getElementById('office');
const ctx = canvas.getContext('2d');
let desks = [];

function roleOf(id) {
  return ROLES[id] || { ...GUEST, label: id.length > 18 ? id.slice(0, 17) + '.' : id };
}

function px(x, y, w, h, c) {
  ctx.fillStyle = c;
  ctx.fillRect(Math.round(x), Math.round(y), w, h);
}

function bubble(text, cx, y, bg, fg) {
  ctx.font = '12px ui-monospace, Consolas, monospace';
  const t = text.length > 26 ? text.slice(0, 25) + '.' : text;
  const w = Math.ceil(ctx.measureText(t).width) + 14;
  const x = Math.round(cx - w / 2);
  px(x, y, w, 20, bg);
  px(cx - 4, y + 20, 8, 4, bg);
  px(cx - 2, y + 24, 4, 2, bg);
  ctx.fillStyle = fg;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(t, cx, y + 11);
}

function drawDesk(desk, index, t) {
  const role = roleOf(desk.id);
  const col = index % COLS, row = Math.floor(index / COLS);
  const ox = col * CW, oy = row * CH;
  const cx = ox + CW / 2;
  const s = desk.status;

  // floor tile
  px(ox + 6, oy + 6, CW - 12, CH - 12, (col + row) % 2 ? '#141c2e' : '#111827');
  px(ox + 6, oy + CH - 10, CW - 12, 4, '#0b1020');

  // chair back
  px(cx - 28, oy + 74, 56, 46, '#374151');
  px(cx - 24, oy + 78, 48, 38, '#4b5563');

  // character
  const bob = s === 'idle' ? Math.round(Math.sin(t / 700 + index) * 1.5) : 0;
  const hy = oy + 52 + bob;
  px(cx - 14, hy, 28, 26, role.skin);
  px(cx - 16, hy - 4, 32, 9, role.hair);
  px(cx - 16, hy + 4, 4, 12, role.hair);
  px(cx + 12, hy + 4, 4, 12, role.hair);
  if (s === 'idle') {
    px(cx - 9, hy + 14, 6, 2, '#1f2937');
    px(cx + 3, hy + 14, 6, 2, '#1f2937');
  } else {
    px(cx - 8, hy + 11, 4, 5, '#1f2937');
    px(cx + 4, hy + 11, 4, 5, '#1f2937');
    if (s === 'waiting') px(cx - 3, hy + 20, 6, 3, '#7f1d1d');
  }
  px(cx - 22, oy + 80, 44, 32, role.color);
  px(cx - 6, oy + 80, 12, 5, role.skin);

  // screen glow on face while working
  if (s === 'working') {
    ctx.globalAlpha = 0.18 + 0.08 * Math.sin(t / 120);
    px(cx - 14, hy, 28, 26, STATUS_COLOR.working);
    ctx.globalAlpha = 1;
  }

  // monitor (back side, facing the character)
  px(cx - 34, oy + 100, 68, 14, '#9ca3af');
  px(cx - 30, oy + 103, 60, 3, STATUS_COLOR[s] || STATUS_COLOR.idle);

  // arms (drawn over the monitor edge so the typing hands stay visible)
  const typing = s === 'working' ? Math.floor(t / 140 + index) % 2 : 0;
  px(cx - 42, oy + 104 + (typing ? 2 : 0), 12, 8, role.skin);
  px(cx + 30, oy + 104 + (typing ? 0 : 2), 12, 8, role.skin);

  // desk
  px(ox + 24, oy + 114, CW - 48, 14, '#8b5e3c');
  px(ox + 24, oy + 128, CW - 48, 5, '#6b4423');
  px(ox + 32, oy + 133, 6, 26, '#6b4423');
  px(ox + CW - 38, oy + 133, 6, 26, '#6b4423');
  // mug + papers
  px(ox + 36, oy + 106, 8, 8, '#e5e7eb');
  px(ox + CW - 52, oy + 108, 16, 6, '#f3f4f6');

  // name plate
  ctx.font = 'bold 12px ui-monospace, Consolas, monospace';
  const lw = Math.ceil(ctx.measureText(role.label).width) + 16;
  px(cx - lw / 2, oy + 164, lw, 20, '#0b1020');
  px(cx - lw / 2, oy + 164, 3, 20, role.color);
  ctx.fillStyle = role.color;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(role.label, cx + 1, oy + 175);

  // status bubble
  if (s === 'working') bubble(desk.activity || 'working', cx, oy + 14, '#1e3a8a', '#dbeafe');
  else if (s === 'waiting' && Math.floor(t / 500) % 2 === 0) bubble('! ' + (desk.activity || 'waiting'), cx, oy + 14, '#78350f', '#fef3c7');
  else if (s === 'done') bubble('OK ' + (desk.activity || 'done'), cx, oy + 14, '#14532d', '#dcfce7');
  else if (s === 'idle') {
    const z = (t / 900 + index) % 1;
    ctx.globalAlpha = 1 - z;
    ctx.fillStyle = '#9ca3af';
    ctx.font = 'bold 12px ui-monospace, Consolas, monospace';
    ctx.fillText('z', cx + 22 + z * 8, oy + 48 - z * 20);
    ctx.globalAlpha = 1;
  }
}

function resize() {
  const rows = Math.max(1, Math.ceil(desks.length / COLS));
  const w = COLS * CW, h = rows * CH;
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
}

function frame(t) {
  resize();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  desks.forEach((d, i) => drawDesk(d, i, t));
  requestAnimationFrame(frame);
}

function orderDesks(map) {
  const known = Object.keys(ROLES).filter((id) => map[id]).map((id) => map[id]);
  const guests = Object.values(map).filter((d) => !ROLES[d.id]).sort((a, b) => a.id.localeCompare(b.id));
  return known.concat(guests);
}

const logEl = document.getElementById('log');
function renderLog(entries) {
  logEl.textContent = '';
  for (const e of entries.slice().reverse()) {
    const li = document.createElement('li');
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = new Date(e.t).toLocaleTimeString();
    const who = document.createElement('span');
    who.className = 'who';
    who.style.color = roleOf(e.desk).color;
    who.textContent = roleOf(e.desk).label;
    const text = document.createElement('span');
    text.textContent = e.text;
    li.append(time, who, text);
    logEl.append(li);
  }
}

const connEl = document.getElementById('conn');
const source = new EventSource('/events');
source.onopen = () => { connEl.textContent = 'live'; connEl.className = 'on'; };
source.onerror = () => { connEl.textContent = 'reconnecting...'; connEl.className = ''; };
source.onmessage = (msg) => {
  try {
    const state = JSON.parse(msg.data);
    desks = orderDesks(state.desks || {});
    renderLog(state.log || []);
  } catch (err) {
    console.error('Invalid state message', err);
  }
};

requestAnimationFrame(frame);
</script>
</body>
</html>

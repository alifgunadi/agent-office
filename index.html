<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Alifs Office</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%234b8df0'/%3E%3Cstop offset='1' stop-color='%232356c9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M10 64c0-13 10-20 22-20s22 7 22 20z' fill='%23ffffff'/%3E%3Cpath d='M26 44l6 8 6-8z' fill='%23e5e7eb'/%3E%3Ccircle cx='32' cy='28' r='13' fill='%23ffe3cc'/%3E%3Cpath d='M19 27c0-10 6-15 13-15s13 5 13 15c-3-5-8-7-13-7s-10 2-13 7z' fill='%233f2a1d'/%3E%3Cg fill='none' stroke='%231f2937' stroke-width='2.2'%3E%3Ccircle cx='26.5' cy='29' r='4.6'/%3E%3Ccircle cx='37.5' cy='29' r='4.6'/%3E%3Cpath d='M31.1 29h1.8'/%3E%3C/g%3E%3Cpath d='M28.5 36.5q3.5 2.5 7 0' fill='none' stroke='%23b4574a' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    @font-face {
      font-family: 'Nunito';
      font-style: normal;
      font-weight: 200 1000;
      font-display: swap;
      src: url(/fonts/nunito-latin-ext.woff2) format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }

    @font-face {
      font-family: 'Nunito';
      font-style: normal;
      font-weight: 200 1000;
      font-display: swap;
      src: url(/fonts/nunito-latin.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    :root {
      color-scheme: light;
      --ink: #1f2a37;
      --muted: #4b5563;
      --paper: #ffffff;
      --line: #e3e8f0;
      --bg1: #dff3ea;
      --bg2: #cfe6f7;
      --red: #d23c3c;
      --blue: #2f6fe0;
      --green: #1f9d55;
      --gold: #f5b82e;
      --radius: 18px;
      --shadow: 0 10px 30px rgba(31, 42, 55, .14), 0 2px 6px rgba(31, 42, 55, .08);
      --font: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      gap: 16px;
      padding: 16px;
      color: var(--ink);
      font: 500 14px/1.55 var(--font);
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      background-attachment: fixed;
    }

    main,
    aside {
      background: var(--paper);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      min-height: 0;
      overflow: hidden;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      flex-wrap: wrap;
      background: linear-gradient(135deg, #2f6fe0, #2457c5);
      color: #fff;
    }

    header h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .06em;
      margin: 0;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .25);
    }

    #conn {
      font-size: 13px;
      font-weight: 700;
      padding: 3px 12px 3px 26px;
      border-radius: 999px;
      background: #fff;
      color: var(--ink);
      position: relative;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .15);
    }

    #conn::before {
      content: "";
      position: absolute;
      left: 10px;
      top: 50%;
      width: 10px;
      height: 10px;
      margin-top: -5px;
      border-radius: 50%;
      background: var(--red);
      transition: background .3s, box-shadow .3s;
    }

    #conn.on::before {
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(31, 157, 85, .22);
    }

    .controls {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    .controls button {
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      background: #fff;
      border: 0;
      border-radius: 999px;
      padding: 7px 16px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .18);
      transition: transform .15s, box-shadow .15s, background .15s;
    }

    .controls button:hover:not(:disabled) {
      background: #fff7d6;
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, .22);
    }

    .controls button:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px;
    }

    .controls button:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: 0 1px 3px rgba(0, 0, 0, .2);
    }

    .controls button:disabled {
      color: #596170;
      background: #e5e9f0;
      cursor: default;
      box-shadow: none;
    }

    .controls #btn-stop {
      color: #a42727;
    }

    .controls #btn-stop:disabled {
      color: #596170;
    }

    #notice {
      display: none;
      margin: 12px 16px 0;
      padding: 10px 14px;
      background: #fdecec;
      color: #7a1d1d;
      border-left: 4px solid var(--red);
      border-radius: 10px;
      line-height: 1.5;
    }

    .stage {
      flex: 1;
      overflow: auto;
      scrollbar-gutter: stable;
      display: flex;
      align-items: flex-start;
      padding: 16px;
      background: linear-gradient(180deg, #e9f7ee, #d6eedd);
    }

    .stage:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: -3px;
    }

    canvas {
      display: block;
      flex: none;
      margin: 0 auto;
      background: transparent;
    }

    aside {
      width: 300px;
      display: flex;
      flex-direction: column;
    }

    aside h2 {
      font-size: 16px;
      font-weight: 800;
      margin: 0;
      padding: 12px 16px;
      background: linear-gradient(135deg, #d23c3c, #b92f4a);
      color: #fff;
      letter-spacing: .03em;
    }

    #log {
      list-style: none;
      margin: 0;
      padding: 4px 0;
      overflow-y: auto;
      overflow-x: hidden;
      flex: 1;
    }

    #log li {
      padding: 9px 16px;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #log li:first-child {
      background: #f1f6ff;
    }

    #log .time {
      color: var(--muted);
      display: block;
      font-size: 12px;
    }

    #log .who {
      margin-right: 6px;
      padding: 1px 8px;
      border-left: 4px solid var(--ink);
      border-radius: 6px;
      background: #f3f5f9;
      color: var(--ink);
      font-weight: 700;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 900px) {
      body {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 8px;
      }

      main {
        flex: 1 0 auto;
      }

      aside {
        width: auto;
        max-height: 40vh;
        flex: 0 0 auto;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>ALIFS OFFICE</h1>
      <span id="conn" aria-live="polite">disconnected</span>
      <div class="controls">
        <button id="btn-restart" type="button" title="Restart the server and reload this page">Restart</button>
        <button id="btn-stop" type="button"
          title="Stop the server until a new Claude Code session or start-office.ps1">Stop</button>
      </div>
    </header>
    <div id="notice" role="status"></div>
    <div class="stage" tabindex="0"><canvas id="office" role="img"
        aria-label="Office floorplan with agent desks and their status"></canvas></div>
    <ul id="agent-list" class="sr-only" aria-label="Agents"></ul>
    <div id="announce" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  </main>
  <aside>
    <h2>Activity</h2>
    <ul id="log" role="log" aria-label="Activity log" aria-live="off"></ul>
  </aside>
  <script>
    'use strict';

    // g: 'f' | 'm'. hs: hairstyle (women: long wavy bob pony bun; men: side quiff undercut wave). outfit: tie polo blazer blouse dress.
    const ROLES = {
      'main': { label: 'AlifGunadi', color: '#e5e7eb', hair: '#3f2a1d', skin: '#ffe3cc', g: 'm', hs: 'side', outfit: 'blazer', glasses: true },
      'product-manager': { label: 'Product Manager', color: '#f59e0b', hair: '#111827', skin: '#e0ac69', g: 'f', hs: 'wavy', outfit: 'blouse' },
      'lead-business-analyst': { label: 'Business Analyst', color: '#14b8a6', hair: '#7c2d12', skin: '#ffdbac', g: 'm', hs: 'side', outfit: 'tie', glasses: true },
      'lead-solution-engineer': { label: 'Solution Eng', color: '#6366f1', hair: '#1f2937', skin: '#c68642', g: 'm', hs: 'quiff', outfit: 'polo', stubble: true },
      'lead-ux': { label: 'Lead UX', color: '#84cc16', hair: '#78350f', skin: '#f1c27d', g: 'f', hs: 'bun', outfit: 'blouse' },
      'lead-system-analyst': { label: 'System Analyst', color: '#f97316', hair: '#374151', skin: '#d9a066', g: 'm', hs: 'undercut', outfit: 'tie' },
      'lead-software-engineer': { label: 'Lead SWE', color: '#3b82f6', hair: '#0f172a', skin: '#f1c27d', g: 'f', hs: 'pony', outfit: 'blouse' },
      'lead-ui': { label: 'Lead UI', color: '#ec4899', hair: '#a16207', skin: '#ffdbac', g: 'f', hs: 'bob', outfit: 'dress' },
      'lead-qa': { label: 'Lead QA', color: '#22c55e', hair: '#451a03', skin: '#8d5524', g: 'm', hs: 'undercut', outfit: 'polo', pants: '#1f2937' },
      'lead-security': { label: 'Lead Security', color: '#ef4444', hair: '#111827', skin: '#e0ac69', g: 'f', hs: 'long', outfit: 'blazer' },
      'lead-dba': { label: 'Lead DBA', color: '#a855f7', hair: '#57534e', skin: '#c68642', g: 'm', hs: 'wave', outfit: 'blazer', glasses: true, pants: '#44403c' },
      'lead-devops': { label: 'Lead DevOps', color: '#0ea5e9', hair: '#292524', skin: '#f1c27d', g: 'm', hs: 'side', outfit: 'polo', stubble: true },
    };
    const PLAQUE_LABEL = { 'product-manager': 'Product Mgr', 'lead-business-analyst': 'Biz Analyst', 'lead-solution-engineer': 'Solution Eng', 'lead-system-analyst': 'Sys Analyst' };
    const plaqueText = (id, label) => {
      if (hasOwn(PLAQUE_LABEL, id)) return PLAQUE_LABEL[id];
      const c = Array.from(label);
      return c.length > 14 ? c.slice(0, 13).join('') + '…' : label;
    };
    const GUEST = { color: '#9ca3af', hair: '#4b5563', skin: '#d6b38a' };
    const STATUS_COLOR = { working: '#2f6fe0', waiting: '#f5b82e', done: '#1f9d55', idle: '#8b93a1' };

    // Zones by role id. Any id not listed here goes to the guest area.
    const ZONE_IDS = {
      trainer: ['main'],
      product: ['product-manager', 'lead-business-analyst', 'lead-system-analyst', 'lead-solution-engineer', 'lead-ux'],
      eng: ['lead-software-engineer', 'lead-ui', 'lead-dba', 'lead-devops'],
      qa: ['lead-qa', 'lead-security'],
    };
    const ZONE_OF = Object.create(null);
    for (const [zone, ids] of Object.entries(ZONE_IDS)) for (const id of ids) ZONE_OF[id] = zone;

    // Door templates (wide layout). `at` is a fraction along the wall. Stacked layouts use a side gutter instead.
    const ZONES = {
      trainer: { label: 'AlifGunadi Office', floor: '#ebe5f8', wall: '#9b8bd0', glass: true, doors: [{ side: 'bottom', at: 0.85, len: 44 }] },
      product: { label: 'Product', floor: '#fdf0d2', wall: '#d9a441', doors: [{ side: 'bottom', at: 0.85, len: 70 }] },
      eng: { label: 'Engineering', floor: '#dcebfa', wall: '#6b9bd6', doors: [{ side: 'top', at: 0.5, len: 80 }] },
      qa: { label: 'Quality & Security', floor: '#e0f3e5', wall: '#6cb58a', glass: true, doors: [{ side: 'top', at: 0.5, len: 70 }] },
      lounge: { label: 'Lounge & Pantry', floor: '#fbe6dc', wall: '#e0a58b', doors: [{ side: 'left', at: 0.6, len: 70 }, { side: 'bottom', at: 0.2, len: 70 }] },
      guest: { label: 'Guests', floor: '#eceef2', wall: '#a3acba', doors: [{ side: 'top', at: 0.5, len: 80 }] },
    };

    const TAU = Math.PI * 2;
    const CW = 180, CH = 160, HDR = 36, TK = 1.1; // desk tile size, zone header strip, trainer desk scale
    const CX = CW / 2;                   // desk centre inside its tile
    const GAP = 28;                      // corridor width between rooms (wide layout)
    const CORRIDOR = '#efe9da';
    const T_WALL = 8, T_GLASS = 5;          // wall thickness
    const WH = 22, WL = 8, WF = 6, WG = 24; // wall heights: tall, lowered back wall, front curb, glass
    const SEAT = 12;                         // seat height of chairs and sofa cushions
    const GX_OFF = 24;                       // stacked layouts: walking gutter offset inside each zone
    const WALK_SPEED = 140, MAX_TRIP_S = 3.5, STRIDE = 0.09;
    const IDLE_TO_LOUNGE_MIN = 10;           // minutes an agent must stay idle before it leaves its desk for the lounge
    const LEAVE_GRACE_MS = IDLE_TO_LOUNGE_MIN * 60 * 1000, STAGGER_STEP = 150, STAGGER_MAX = 1500;
    const TOP_PAD = 56;                      // css px above the floor for bubbles
    const LBL = 46;                          // floor strip at the front of each room reserved for the room name
    const FLOOR_UPRIGHT = 0.5;               // 0 = floor lettering fully on the floor plane, 1 = no shear (more legible)
    const STROLL_SPEED = 85;                 // lounge strolls (world units per second)
    const FONT_E = ", 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji'";

    const canvas = document.getElementById('office');
    const stage = document.querySelector('.stage');
    const ctx = canvas.getContext('2d');
    let desks = [];
    let deskMap = new Map();
    let idSig = '';
    let layout = null, layoutDirty = true, layoutVer = 0, availW = null, shadowK = 1, dpr = 1, sc = 1;
    let animT = 0, lastT = 0, ariaKey = '', availH = 0, mouse = null, focusId = null;
    const agents = new Map(); // desk id -> animation state
    let slotOwner = [];
    // Projection: wide layout is isometric (2:1), stacked layouts use a tilted oblique view.
    const P = { c: 1, s: 1, K: 0.75, tilt: 0.5, zk: 0.85, cs: 1, ox: 0, oy: 0 };

    const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

    function roleOf(id) {
      id = String(id ?? '');
      if (hasOwn(ROLES, id)) return ROLES[id];
      // Plugin agents are named "plugin:agent"; show the agent part.
      const name = id.includes(':') ? id.slice(id.lastIndexOf(':') + 1) : id;
      const chars = Array.from(name);
      const h = hashStr(id), f = h % 2 === 1;
      const hs = (f ? ['long', 'bob', 'pony', 'wavy', 'bun'] : ['side', 'quiff', 'undercut', 'wave'])[(h >> 1) % (f ? 5 : 4)];
      return { ...GUEST, label: chars.length > 18 ? chars.slice(0, 17).join('') + '.' : name, g: f ? 'f' : 'm', hs, outfit: f ? 'blouse' : 'polo' };
    }

    function hashStr(s) {
      s = String(s);
      let h = 5381;
      for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
      return Math.abs(h);
    }

    // Reduced motion: teleport between desk and lounge and freeze the canvas animation.
    const motionQuery = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    let reduced = !!(motionQuery && motionQuery.matches);
    if (motionQuery) {
      const onMotion = (e) => { reduced = e.matches; renderNow(); };
      if (motionQuery.addEventListener) motionQuery.addEventListener('change', onMotion);
      else if (motionQuery.addListener) motionQuery.addListener(onMotion);
    }

    const FONT = "'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif";
    const MAX_BUBBLE_CHARS = 32;
    const BUBBLE_MAX = 156; // bubble width cap

    // ---------- 2D helpers ----------

    function rr(x, y, w, h, r, fill) {
      r = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    }

    function circle(x, y, r, fill) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, TAU);
      ctx.fillStyle = fill;
      ctx.fill();
    }

    function limb(x0, y0, x1, y1, w, col) {
      ctx.lineCap = 'round';
      ctx.lineWidth = w;
      ctx.strokeStyle = col;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(x1, y1);
      ctx.stroke();
    }

    // Canvas shadows ignore the transform, so scale them by the effective pixel ratio (overlay pass only).
    function soft(blur, dy, alpha) {
      ctx.shadowColor = 'rgba(31,42,55,' + alpha + ')';
      ctx.shadowBlur = blur * shadowK;
      ctx.shadowOffsetY = dy * shadowK;
    }
    function noShadow() {
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;
    }

    function fitText(text, maxChars, maxW) {
      let a = Array.from(String(text ?? ''));
      if (a.length > maxChars) a = a.slice(0, maxChars - 1).concat('…');
      while (a.length > 2 && ctx.measureText(a.join('')).width > maxW) a.splice(a.length - 2, 2, '…');
      return a.join('');
    }

    const mixCache = new Map();
    // Lighten (f > 0) or darken (f < 0) a #rrggbb colour.
    function mix(hex, f) {
      const key = hex + '|' + f;
      let r = mixCache.get(key);
      if (r) return r;
      const n = parseInt(hex.slice(1), 16);
      const to = f < 0 ? 0 : 255, a = Math.abs(f);
      const ch = (v) => Math.round(v + (to - v) * a);
      r = 'rgb(' + ch((n >> 16) & 255) + ',' + ch((n >> 8) & 255) + ',' + ch(n & 255) + ')';
      mixCache.set(key, r);
      return r;
    }

    // ---------- projection and solids ----------

    function setProj(cols) {
      if (cols === 0) { P.c = 0.883; P.s = 0.469; P.K = 1; P.tilt = 0.52; P.zk = 0.95; P.cs = 1.2; }
      else { P.c = 1; P.s = 0; P.K = 1; P.tilt = 0.62; P.zk = 0.9; P.cs = 1.3; }
    }

    // World (x, y, height z) -> scene px.
    function pj(x, y, z) {
      return [(x * P.c - y * P.s) * P.K + P.ox, (x * P.s + y * P.c) * P.K * P.tilt - (z || 0) * P.zk + P.oy];
    }

    function fillPoly(pts, fill) {
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
    }

    function flat(x0, y0, x1, y1, z, fill) {
      fillPoly([pj(x0, y0, z), pj(x1, y0, z), pj(x1, y1, z), pj(x0, y1, z)], fill);
    }

    // Vertical rectangle in the plane y = const (faces the viewer).
    function vface(y, x0, x1, z0, z1, fill) {
      fillPoly([pj(x0, y, z0), pj(x1, y, z0), pj(x1, y, z1), pj(x0, y, z1)], fill);
    }

    function groundShadow(x0, y0, x1, y1, h) {
      const d = Math.min(14, h * 0.45 + 2);
      flat(x0 + d, y0 + d, x1 + d, y1 + d, 0, 'rgba(31,42,55,0.11)');
    }

    // Extruded box: lit top, front (+y) face and shaded side (+x) face. o.glass = translucent.
    function box(x0, y0, x1, y1, z0, z1, col, o) {
      o = o || {};
      if (!o.noShadow) groundShadow(x0, y0, x1, y1, z1);
      const g = !!o.glass;
      fillPoly([pj(x0, y1, z0), pj(x1, y1, z0), pj(x1, y1, z1), pj(x0, y1, z1)], g ? 'rgba(160,215,240,0.30)' : col);
      if (P.s > 0) fillPoly([pj(x1, y1, z0), pj(x1, y0, z0), pj(x1, y0, z1), pj(x1, y1, z1)], g ? 'rgba(120,190,225,0.38)' : mix(col, -0.22));
      fillPoly([pj(x0, y0, z1), pj(x1, y0, z1), pj(x1, y1, z1), pj(x0, y1, z1)], g ? 'rgba(235,248,255,0.65)' : mix(col, 0.16));
      if (g) {
        ctx.strokeStyle = 'rgba(255,255,255,0.9)';
        ctx.lineWidth = 1;
        ctx.stroke();

    function assignSlot(a) {

      let idx = start;
      for (let i = 0; i < n; i++) {

    // Route desk -> own door -> corridor -> lounge door -> hub -> slot, in world coords.

    // A lounging agent walks to another free slot (reserved up front so nobody overlaps).

    function updateAgents(dt, now, big) {

    // Conversation groups in the lounge (slot indices), with turn taking.

            speak, laugh,
            look: dirTo(a, speak ? occ[(turn + 1) % occ.length] : sp),
            nod: !speak && ((t / 700 + a.seed) % 5) < 0.6,

    function refreshAria() {

        }).join('; ')
        : 'No agents yet.';
      if (txt === ariaKey) return;
      ariaKey = txt;
      canvas.setAttribute('aria-label', 'Office floorplan. ' + txt);
    }

    // ---------- floorplan geometry ----------

    function runs(a0, a1, gaps) {
      const g = gaps.slice().sort((p, q) => p[0] - q[0]);

        d.outX = d.x; d.outY = d.y; d.inX = d.x; d.inY = d.y;
        if (d.side === 'top') { d.outY = d.y - out; d.inY = d.y + inn; }
        else if (d.side === 'bottom') { d.outY = d.y + out; d.inY = d.y - inn; }
        else if (d.side === 'left') { d.outX = d.x - 8; d.inX = d.x + inn; }
        else { d.outX = d.x + 8; d.inX = d.x - inn; }
        return d;
      });
    }

    function loungeGeom(z, stacked) {
      const X = z.x, Y = z.y, w = z.w, h = z.h - LBL; // furniture area; the bottom strip is the floor label
      const tw = 130, th = 58, tx = X + (w - tw) / 2, ty = Y + h - th - 34;
      const g = { z };
      g.table = { x0: tx, y0: ty, x1: tx + tw, y1: ty + th };
      g.seats = [[tx + 30, ty - 14], [tx + tw - 30, ty - 14], [tx + 30, ty + th + 14], [tx + tw - 30, ty + th + 14]];
      g.plants = [[X + 26, Y + h - 24], [X + w - 26, Y + h - 24]];
      g.counterX = X + w - 128;
      g.door = z.doors.find((d) => d.side === 'bottom');
      g.hub = { x: stacked ? X + GX_OFF : g.door.x, y: Y + 112 };
      const sofa = [71, 121, 171].map((dx) => [X + dx, Y + 66]);
      const S = (type, x, y, zz, face, anim, via, side, flipFace) => ({ type, x, y, z: zz, face: face || 'front', anim: anim || null, via: via || null, side: !!side, flipFace: !!flipFace });
      g.slots = [
        S('sofa', sofa[0][0], sofa[0][1], SEAT, 'front', 'chat'),
        S('coffee', X + w - 100, Y + 92, 0, 'front', 'coffee'),
        S('table', g.seats[0][0], g.seats[0][1], SEAT, 'front', 'chat'),
        S('sofa', sofa[1][0], sofa[1][1], SEAT, 'front', 'chat'),
        S('table', g.seats[1][0], g.seats[1][1], SEAT, 'front', 'chat'),
        S('plant', X + 54, Y + h - 46, 0, 'front', 'stretch'),
        S('coffee', X + w - 54, Y + 92, 0, 'front', 'coffee'),
        S('sofa', sofa[2][0], sofa[2][1], SEAT, 'front', 'chat'),
        S('table', g.seats[2][0], g.seats[2][1], SEAT, 'back', 'chat', [tx - 18, g.seats[2][1]]),
        S('floor', X + w * 0.5 - 34, Y + 102, 0, 'front', 'chat', null, true, false),
        S('plant', X + w - 54, Y + h - 46, 0, 'front', 'stretch'),
        S('table', g.seats[3][0], g.seats[3][1], SEAT, 'back', 'chat', [tx - 18, g.seats[3][1]]),
        S('floor', X + w * 0.5 + 34, Y + 102, 0, 'front', 'chat', null, true, true),
      ];
      return g;
    }

    // Floor lettering: the room name lies on the floor, using the floor's own affine basis.
    function drawFloorLabel(z) {
      const T = z.glass ? T_GLASS : T_WALL;
      const ax = P.c * P.K, ay = P.s * P.K * P.tilt;
      const byv = P.c * P.K * P.tilt, bxv = -P.s * P.K * (1 - FLOOR_UPRIGHT);
      const vs = Math.min(1.8, 0.9 * Math.hypot(ax, ay) / byv);
      const ph = 24;
      let fs = 20;
      ctx.font = '800 ' + fs + 'px ' + FONT;
      let tw = ctx.measureText(z.label).width;
      const avail = z.w - 2 * T - 28;
      if (tw + 24 > avail) { fs = Math.max(14, fs * avail / (tw + 24)); ctx.font = '800 ' + fs + 'px ' + FONT; tw = ctx.measureText(z.label).width; }
      const w = tw + 24;
      const gaps = gapsFor(z, 'bottom');
      const clash = (x0) => gaps.some((g) => x0 < g[1] + 10 && x0 + w > g[0] - 10);
      let x = z.x + T + 12;
      if (clash(x)) {
        const cands = gaps.map((g) => g[1] + 10).concat([z.x + z.w - T - 12 - w]);
        x = cands.find((c) => c + w <= z.x + z.w - T - 8 && !clash(c)) ?? x;
      }
      const y = z.y + z.h - T - 1 - ph * vs;
      const o = pj(x, y, 0.5);
      ctx.save();
      ctx.transform(ax, ay, bxv * vs, byv * vs, o[0], o[1]);
      rr(0, 0, w, ph, 8, 'rgba(255,255,255,0.6)');
      ctx.fillStyle = '#1f2a37';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.font = '800 ' + fs + 'px ' + FONT;
      ctx.fillText(z.label, 12, ph / 2 + 1);
      if (z.key === 'guest' && z.empty) {
        const note = 'No visitors right now';
        ctx.font = '700 17px ' + FONT;
        const nw = ctx.measureText(note).width;
        if (x + w + 14 + nw < z.x + z.w - T - 8) {
          ctx.fillStyle = '#4b5563';
          ctx.fillText(note, w + 14, ph / 2 + 1);
        }
      }
      ctx.restore();
    }

    function buildLayout(list, cols) {
      setProj(cols);
      const stacked = cols > 0;
      const groups = { trainer: [], product: [], eng: [], qa: [], guest: [] };
      list.forEach((d, index) => { groups[ZONE_OF[d.id] || 'guest'].push({ id: d.id, index }); });
      const L = { cols, zones: [], places: [], byId: new Map(), floors: [], ground: [], items: [], ver: ++layoutVer };
      const zone = (key, x, y, w, h, row) => {
        const z = Object.assign({ key, x, y, w, h, row }, ZONES[key]);
        z.hN = z.glass ? WG : (row === 0 ? WH : WL);
        resolveDoors(z, stacked);
        L.zones.push(z);
        return z;
      };
      const put = (pl) => { L.places.push(pl); L.byId.set(pl.id, pl); };
      const grid = (z, items, c) => {
        const gx = z.x + (z.w - c * CW) / 2;
        items.forEach((p, i) => put({ id: p.id, index: p.index, zone: z, x: gx + (i % c) * CW, y: z.y + HDR + Math.floor(i / c) * CH, k: 1 }));
      };
      const trainer = (z, items) => items.forEach((p) => put({ id: p.id, index: p.index, zone: z, x: z.x + (z.w - CW * TK) / 2, y: z.y + HDR, k: TK }));
      const guests = (x, y, w, c, row) => {
        const n = groups.guest.length;
        const z = zone('guest', x, y, w, n ? HDR + Math.ceil(n / c) * CH + LBL + 12 : LBL + 14, row);
        z.empty = !n;
        grid(z, groups.guest, c);
        return z;
      };
      let W, H;
      if (!stacked) {
        const R1 = 284, R2 = HDR + CH + LBL + 14, y2 = 10 + R1 + GAP;
        const tw = 260, pw = 5 * CW + 30, lw = 350;
        const px = 10 + tw + GAP, lx = px + pw + GAP, right = lx + lw;
        W = right + 10;
        trainer(zone('trainer', 10, 10, tw, R1, 0), groups.trainer);
        grid(zone('product', px, 10, pw, R1, 0), groups.product, 5);
        zone('lounge', lx, 10, lw, R1, 0);
        const ew = 4 * CW + 20, qx = 10 + ew + GAP;
        grid(zone('eng', 10, y2, ew, R2, 1), groups.eng, 4);
        grid(zone('qa', qx, y2, right - qx, R2, 1), groups.qa, 2);
        const g = guests(10, y2 + R2 + GAP, right - 10, 6, 2);
        H = g.y + g.h + 10;
      } else {
        W = cols * CW + 40;
        const zw = W - 20;
        let y = 10, row = 0;
        const next = (key, h) => { const z = zone(key, 10, y, zw, h, row++); y += h + 10; return z; };
        const rows = (key) => Math.ceil(ZONE_IDS[key].length / cols);
        trainer(next('trainer', HDR + Math.ceil(CH * TK) + LBL + 12), groups.trainer);
        grid(next('product', HDR + rows('product') * CH + LBL + 22), groups.product, cols);
        grid(next('eng', HDR + rows('eng') * CH + LBL + 12), groups.eng, cols);
        grid(next('qa', HDR + rows('qa') * CH + LBL + 12), groups.qa, cols);
        next('lounge', 230 + LBL);
        const n = groups.guest.length;
        const gz = next('guest', n ? HDR + Math.ceil(n / cols) * CH + LBL + 12 : LBL + 14);
        gz.empty = !n;
        grid(gz, groups.guest, cols);
        H = y;
      }
      L.W = W; L.H = H;
      const lz = L.zones.find((z) => z.key === 'lounge');
      L.lounge = loungeGeom(lz, stacked);

      // base slab (corridor) and zone floors
      L.floors.push(() => {
        flat(18, 18, W + 18, H + 18, -9, 'rgba(31,42,55,0.10)');
        box(0, 0, W, H, -9, -2, CORRIDOR, { noShadow: true });
      });
      for (const z of L.zones) {
        L.floors.push(() => {
          box(z.x, z.y, z.x + z.w, z.y + z.h, -2, 0, z.floor, { noShadow: true });
          ctx.strokeStyle = 'rgba(255,255,255,0.4)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          for (let x = z.x + 40; x < z.x + z.w - 4; x += 40) {
            const a = pj(x, z.y + 4, 0), b = pj(x, z.y + z.h - 4, 0);
            ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
          }
          for (let y = z.y + 40; y < z.y + z.h - 4; y += 40) {
            const a = pj(z.x + 4, y, 0), b = pj(z.x + z.w - 4, y, 0);
            ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]);
          }
          ctx.stroke();
        });
        L.ground.push(() => drawFloorLabel(z));
      }
      for (const z of L.zones) { addWalls(L, z); addProps(L, z); }
      for (const p of L.places) addDesk(L, p);
      addLounge(L);

      // scene extents (scene px, before the css scale)
      P.ox = 0; P.oy = 0;
      const cs = [pj(0, 0, 0), pj(W, 0, 0), pj(0, H, 0), pj(W, H, 0)];
      const us = cs.map((c) => c[0]), vs = cs.map((c) => c[1]);
      const minU = Math.min(...us), maxU = Math.max(...us), minV = Math.min(...vs), maxV = Math.max(...vs);
      const padX = 12, extra = WH * P.zk + 6;
      L.sceneW = maxU - minU + padX * 2;
      L.ox = padX - minU;
      L.sceneH = maxV - minV + extra + 9 * P.zk + 16;
      L.oy = extra - minV;
      return L;
    }

    function addWalls(L, z) {
      const g = !!z.glass, T = g ? T_GLASS : T_WALL, col = g ? '#8fcbe6' : z.wall;
      const o = g ? { glass: true, noShadow: true } : {};
      const hN = z.hN, hW = g ? WG : WH, hF = g ? WG : WF;
      runs(z.x + T, z.x + z.w, gapsFor(z, 'top')).forEach(([a, b]) => addBoxItem(L, a, z.y, b, z.y + T, 0, hN, col, o));
      runs(z.y, z.y + z.h, gapsFor(z, 'left')).forEach(([a, b]) => addBoxItem(L, z.x, a, z.x + T, b, 0, hW, col, o));
      runs(z.x + T, z.x + z.w, gapsFor(z, 'bottom')).forEach(([a, b]) => addBoxItem(L, a, z.y + z.h - T, b, z.y + z.h, 0, hF, col, o));
      runs(z.y + T, z.y + z.h - T, gapsFor(z, 'right')).forEach(([a, b]) => addBoxItem(L, z.x + z.w - T, a, z.x + z.w, b, 0, hF, col, o));
    }

    function drawPlant(x, y, r) {
      const k = r / 12;
      box(x - 7, y - 7, x + 7, y + 7, 0, 11, '#b7794a');
      const c = pj(x, y, 11);
      for (const [dx, dy, rad, col] of [[-5, -6, 8, '#3f9d5a'], [6, -8, 8, '#4fb36b'], [0, -17, 9, '#2f8a4c'], [0, -9, 9, '#3f9d5a']]) {
        circle(c[0] + dx * k, c[1] + dy * k, rad * k, col);
      }
    }
    function addPlant(L, x, y, r) { addItem(L, x - 9, y - 9, x + 9, y + 9, () => drawPlant(x, y, r)); }

    function addProps(L, z) {
      const x = z.x, y = z.y, w = z.w, h = z.h;
      if (z.key === 'trainer') {
        addPlant(L, x + w - 24, y + 70, 12);
      } else if (z.key === 'product') {
        // whiteboard on the north wall
        const bx = x + w - 210, by = y + T_WALL;
        addItem(L, bx, by, bx + 190, by + 1, () => {
          vface(by + 0.5, bx, bx + 190, 7, 25, '#ffffff');
          // outline follows the wall plane (four projected corners), not a screen-aligned rectangle
          const q = [pj(bx, by + 0.5, 7), pj(bx + 190, by + 0.5, 7), pj(bx + 190, by + 0.5, 25), pj(bx, by + 0.5, 25)];
          ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1.5; ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(q[0][0], q[0][1]);
          for (let i = 1; i < 4; i++) ctx.lineTo(q[i][0], q[i][1]);
          ctx.closePath();
          ctx.stroke();
          [['#2f6fe0', 14, 60], ['#d23c3c', 70, 40], ['#1f9d55', 118, 56]].forEach(([c, a, len]) => {
            for (const [zz, f] of [[20, 0.6], [14, 1]]) {
              const p0 = pj(bx + a, by + 0.5, zz), p1 = pj(bx + a + len * f, by + 0.5, zz);
              limb(p0[0], p0[1], p1[0], p1[1], 2, c);
            }
          });
        });
        // discussion table
        const tw = 150, th = 34, tx = x + (w - tw) / 2, ty = y + h - th - 14;
        addItem(L, tx, ty, tx + tw, ty + th, () => {
          box(tx, ty, tx + tw, ty + th, 0, 18, '#c9a074');
          flat(tx + 30, ty + 8, tx + 52, ty + 20, 18.3, '#f8fafc');
          box(tx + 96, ty + 13, tx + 104, ty + 21, 18, 24, '#ffffff', { noShadow: true });
        });
      } else if (z.key === 'eng') {
        // small server rack
        const rx = x + w - 72, ry = y + T_WALL + 4;
        addItem(L, rx, ry, rx + 56, ry + 16, () => {
          box(rx, ry, rx + 56, ry + 16, 0, 40, '#374151');
          for (let i = 0; i < 3; i++) {
            vface(ry + 16, rx + 4 + i * 17, rx + 18 + i * 17, 8, 34, '#4b5563');
            const c = pj(rx + 11 + i * 17, ry + 16, 21);
            circle(c[0], c[1], 2.2, i === 1 ? '#38bdf8' : '#4ade80');
          }
        });
      }
    }

    function addLounge(L) {
      const g = L.lounge, z = g.z, X = z.x, Y = z.y, w = z.w, t = g.table;
      // low things that characters sit on are drawn in the ground pass
      L.ground.push(() => {
        for (let i = 0; i < 3; i++) box(X + 47 + i * 50, Y + 52, X + 95 + i * 50, Y + 80, 0, SEAT, '#e08a78', { noShadow: true });
        g.seats.forEach((s) => box(s[0] - 9, s[1] - 9, s[0] + 9, s[1] + 9, 0, SEAT, '#6b7280', { noShadow: true }));
      });
      addBoxItem(L, X + 46, Y + 40, X + 196, Y + 52, 0, 34, '#d9776a');
      addBoxItem(L, X + 38, Y + 40, X + 46, Y + 80, 0, 22, '#c26a5a');
      addBoxItem(L, X + 196, Y + 40, X + 204, Y + 80, 0, 22, '#c26a5a');
      // coffee counter, machine and cups
      const cx0 = g.counterX;
      addItem(L, cx0, Y + 34, cx0 + 110, Y + 70, () => {
        box(cx0, Y + 34, cx0 + 110, Y + 70, 0, 30, '#8b6b4f');
        box(cx0 + 10, Y + 36, cx0 + 40, Y + 58, 30, 52, '#374151', { noShadow: true });
        const c = pj(cx0 + 25, Y + 58, 44);
        circle(c[0], c[1], 2.6, '#f87171');
        box(cx0 + 62, Y + 52, cx0 + 70, Y + 60, 30, 35, '#ffffff', { noShadow: true });
        box(cx0 + 82, Y + 52, cx0 + 90, Y + 60, 30, 35, '#ffffff', { noShadow: true });
      });
      // meeting table
      addItem(L, t.x0, t.y0, t.x1, t.y1, () => {
        box(t.x0, t.y0, t.x1, t.y1, 0, 20, '#c9a074');
        flat(t.x0 + 12, t.y0 + 10, t.x0 + 40, t.y0 + 26, 20.3, 'rgba(255,255,255,0.35)');
        box(t.x1 - 36, t.y0 + 22, t.x1 - 28, t.y0 + 30, 20, 26, '#ffffff', { noShadow: true });
      });
      g.plants.forEach((p) => addPlant(L, p[0], p[1], 12));
    }

    function addDesk(L, p) {
      const k = p.k, id = p.id, ox = p.x, oy = p.y;
      const X = (d) => ox + (CX + d) * k, Y = (v) => oy + v * k; // d = offset from the desk centre
      const chairOf = () => { const a = agents.get(id); return a ? a.chair : 0; };
      L.ground.push(() => flat(X(-70), Y(20), X(70), Y(CH - 10), 0.3, 'rgba(255,255,255,0.28)'));
      L.ground.push(() => {
        const c = chairOf(), dx = 9 * k * c, dy = 16 * k * c;
        box(X(-18) + dx, Y(62) + dy, X(18) + dx, Y(96) + dy, 0, SEAT, '#6b7280', { noShadow: true });
      });
      // chair back (behind the seated character)
      addItem(L, X(-20), Y(56), X(20), Y(62), () => {
        const c = chairOf(), dx = 9 * k * c, dy = 16 * k * c;
        box(X(-20) + dx, Y(56) + dy, X(20) + dx, Y(62) + dy, 8, 36, '#4b5563', { noShadow: true });
      });
      // desk: legs, full-width front panel carrying the name plaque, top, monitor (back faces the viewer), mug, papers
      addItem(L, X(-75), Y(100), X(75), Y(124), () => {
        const a = agents.get(id), away = !!a && a.s > 0.5;
        const st = (deskMap.get(id) || {}).status || 'idle';
        groundShadow(X(-75), Y(100), X(75), Y(124), 34);
        box(X(-75), Y(100), X(-68), Y(120), 0, 30, '#7d5232', { noShadow: true });
        box(X(68), Y(100), X(75), Y(120), 0, 30, '#7d5232', { noShadow: true });
        box(X(-75), Y(116), X(75), Y(124), 2, 30, '#8a5a38', { noShadow: true });
        box(X(-75), Y(100), X(75), Y(124), 30, 34, '#a8744a', { noShadow: true });
        flat(X(-18), Y(112), X(18), Y(120), 34.2, '#d1d5db');
        flat(X(30), Y(106), X(62), Y(118), 34.2, '#f8fafc');
        box(X(-62), Y(106), X(-54), Y(114), 34, 41, '#ffffff', { noShadow: true });
        box(X(-6), Y(106), X(6), Y(110), 34, 38, '#6b7280', { noShadow: true });
        box(X(-30), Y(106), X(30), Y(110), 38, 48, away ? '#374151' : '#9ca3af', { noShadow: true });
        if (!away) {
          const hp = { working: 0.6, waiting: 0.3, done: 1, idle: 0.1 }[st] ?? 0.1;
          vface(Y(110), X(-24), X(24), 41, 44.5, '#e5e7eb');
          vface(Y(110), X(-24), X(-24) + Math.max(4, 48 * hp) * k, 41, 44.5, STATUS_COLOR[st] || STATUS_COLOR.idle);
        }
        // name plaque on the front panel (vertical plane, so the text stays upright; dimmed when the owner is away)
        const role = roleOf(id), text = plaqueText(id, role.label);
        let fs = 18;
        ctx.font = '800 ' + fs + 'px ' + FONT;
        let tw = ctx.measureText(text).width;
        if (tw > 124) { fs = Math.max(13, fs * 124 / tw); ctx.font = '800 ' + fs + 'px ' + FONT; tw = ctx.measureText(text).width; }
        const pw = Math.min(146, tw + 26), ph = 25;
        const o = pj(X(0) - pw * k / 2, Y(124) + 0.2, 29);
        ctx.save();
        ctx.transform(P.c * P.K * k, P.s * P.K * P.tilt * k, 0, P.zk * k, o[0], o[1]);
        ctx.globalAlpha = away ? 0.6 : 1;
        rr(0, 0, pw, ph, 6, '#ffffff');
        rr(0, 0, pw, ph, 6);
        ctx.lineWidth = 1.5; ctx.strokeStyle = '#5b3b22'; ctx.stroke();
        rr(2, 2, 7, ph - 4, 3, away ? '#9ca3af' : role.color);
        ctx.fillStyle = '#0f172a';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.font = '800 ' + fs + 'px ' + FONT;
        ctx.fillText(text, 14, ph / 2 + 1);
        ctx.restore();
      });
    }

    // ---------- drawing the scene ----------

    function drawAgent(a, p) {
      const role = roleOf(a.id), g = layout.lounge, slot = a.slot >= 0 ? g.slots[a.slot] : null;
      const st = (deskMap.get(a.id) || {}).status || a.status;
      const atDesk = a.s <= 0.5, inLounge = !!slot && !a.st && a.s >= a.total - 0.5;
      const ch = a.chat;
      let pose = 'walk', z = 0, face = 'front', anim = null, side = false, flip = a.flip;
      if (atDesk) {
        pose = 'sit'; z = SEAT; flip = false;
        if (st === 'working') anim = 'type';
      } else if (inLounge) {
        pose = slot.z > 0 ? 'sit' : 'stand'; z = slot.z; face = slot.face; flip = false;
        anim = slot.anim === 'chat' ? (ch && ch.speak ? 'chat' : null) : slot.anim;
        if (slot.side) { side = true; flip = slot.flipFace; }
      } else if (a.st) {
        const from = g.slots[a.slot].z, to = g.slots[a.st.to].z;
        z = Math.max(from * Math.max(0, 1 - a.st.p / 14), to * Math.max(0, 1 - (a.st.len - a.st.p) / 14));
      } else if (a.s < 18) {
        z = SEAT * (1 - a.s / 18);
      } else if (slot && slot.z > 0 && a.total - a.s < 18) {
        z = slot.z * (1 - (a.total - a.s) / 18);
      }
      const v = pj(a.x, a.y, z);
      drawChar(role, v[0], v[1], {
        pose, face, anim, side, flip, ph: a.s * STRIDE + (a.st ? a.st.p * STRIDE : 0), t: animT, seed: a.seed, k: p.k * P.cs,
        status: st, sleepy: atDesk && st === 'idle',
        speak: !!(ch && ch.speak), look: ch ? ch.look : 0, laugh: !!(ch && ch.laugh), nod: !!(ch && ch.nod),
      }, a);
    }

    function safe(fn) {
      ctx.save();
      try { fn(); } catch (err) { warnOnce(err); } finally { ctx.restore(); }
    }

    function drawOverlays(cssW) {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      shadowK = dpr;
      noShadow();
      ctx.globalAlpha = 1;
      const list = [];
      for (const a of agents.values()) if (isFinite(a.hx) && isFinite(a.hy)) list.push(a);
      list.sort((m, n) => m.hy - n.hy);

      // hovered agent (frontmost under the pointer)
      let hover = null;
      if (mouse) {
        for (const a of list) {
          const r = a.hitR;
          if (r && mouse.x >= r.x && mouse.x <= r.x + r.w && mouse.y >= r.y && mouse.y <= r.y + r.h) {
            if (!hover || a.fy > hover.fy) hover = a;
          }
        }
      }

      const hitOf = (r, ignore) => (list.some((o) => o !== ignore && o.hitR && overlapsRect(r, o.hitR)));
      const draws = [], bubbles = [], tags = [], dots = [];
      const takenTags = [];
      let hoverTag = null;
      const MAX_TAGS = 3;
      // No name labels above characters (walking or hovered): agents away from the desk show only a colour dot.
      const showTag = new Set();

      for (const a of list) {
        const role = roleOf(a.id);
        const cx = Math.max(40, Math.min(a.hx * sc, cssW - 40));
        if (a.s > 0.5) {
          // away from the desk: colour dot unless the agent has a tag
          if (!showTag.has(a)) dots.push(() => {
            circle(a.hx * sc, a.hy * sc - 8, 5, '#ffffff');
            circle(a.hx * sc, a.hy * sc - 8, 3.5, role.color);
          });
          if (a.chat && a.chat.speak && a.loc === 'in the lounge') {
            const icon = a.chat.icon;
            draws.push(() => speechIcon(cx, a.hy * sc - 60, icon));
          }
          continue;
        }
        const d = deskMap.get(a.id) || {};
        const bx = Math.max(BUBBLE_MAX / 2 + 6, Math.min(a.hx * sc, cssW - BUBBLE_MAX / 2 - 6));
        const y = Math.max(2, a.hy * sc - 6 - 35);
        if (d.status === 'working') bubbles.push(() => bubble(d.activity || 'working', bx, y, '#2f6fe0'));
        else if (d.status === 'waiting') bubbles.push(() => bubble(d.activity || 'waiting', bx, y, '#d99a0b', '!', (reduced || Math.floor(animT / 500) % 2 === 0) ? 1 : 0.25, '#a86a00'));
        else if (d.status === 'done') bubbles.push(() => bubble(d.activity || 'done', bx, y, '#1f9d55', '✓', 1, '#157a40'));
        else if (d.status === 'idle') {
          draws.push(() => {
            const zf = reduced ? 0.3 : (animT / 900 + a.seed) % 1;
            ctx.globalAlpha = 1 - zf;
            ctx.fillStyle = '#4b5563';
            ctx.font = '800 14px ' + FONT;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'alphabetic';
            ctx.fillText('z', a.hx * sc + 16 + zf * 8, a.hy * sc + 10 - zf * 18);
            ctx.globalAlpha = 1;
          });
        }
      }
      if (focusId) {
        const fa = agents.get(focusId);
        if (fa && isFinite(fa.hx) && isFinite(fa.hy)) {
          const frole = roleOf(fa.id);
          const fx = Math.max(40, Math.min(fa.hx * sc, cssW - 40));
          tags.push(() => tag(frole, fx, Math.max(22, fa.hy * sc - 44)));
        }
      }
      for (const group of [dots, draws, bubbles, tags]) for (const f of group) safe(f);
      if (hoverTag) safe(hoverTag);
      canvas.style.cursor = '';
    }

    function measureStage() {
      const cs = getComputedStyle(stage);
      availW = Math.max(0, stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight));
      availH = Math.max(0, stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom));
      layoutDirty = true;
      requestRender();
    }
    // A resize clears the canvas, so redraw right away instead of waiting for an animation frame
    // (frames do not run for a covered window, and with reduced motion nothing else would redraw it).
    const onStageResize = () => { measureStage(); renderNow(); };
    if (window.ResizeObserver) new ResizeObserver(onStageResize).observe(stage);
    window.addEventListener('resize', onStageResize);

    // Make sure the web font is ready for canvas text (frames redraw continuously, so it appears once loaded).
    if (document.fonts && document.fonts.load) {
      Promise.all([document.fonts.load('700 13px Nunito'), document.fonts.load('800 13px Nunito')]).then(renderNow, () => { });
    }

    let warned = false;
    function warnOnce(err) {
      if (warned) return;
      warned = true;
      console.error('Canvas draw error', err);
    }

    let sizedKey = '';
    function render(t) {
      if (availW == null) measureStage();
      // wide isometric floorplan when there is room, otherwise stacked zones with 3 or 2 desk columns
      const cols = availW >= 1100 ? 0 : availW >= 700 ? 3 : 2;
      if (layoutDirty || !layout || layout.cols !== cols) {
        layout = buildLayout(desks, cols);
        layoutDirty = false;
      }
      const sw = layout.sceneW;
      let cssW;
      if (cols) {
        cssW = Math.round(Math.max(sw, Math.min(availW, sw * 1.6)));
      } else {
        // wide: fit the projected bounding box into the stage (width and height) so nothing scrolls
        const byW = availW / sw;
        const byH = availH > TOP_PAD + 200 ? (availH - TOP_PAD) / layout.sceneH : Infinity;
        cssW = Math.round(sw * Math.max(0.5, Math.min(byW, byH, 1.35)));
      }
      if (cssW <= 0) return;
      sc = cssW / sw;
      const cssH = Math.round(layout.sceneH * sc + TOP_PAD);
      dpr = Math.max(1, window.devicePixelRatio || 1);
      const pw = Math.round(cssW * dpr), ph = Math.round(cssH * dpr);
      if (canvas.width !== pw || canvas.height !== ph) { canvas.width = pw; canvas.height = ph; }
      const key = cssW + 'x' + cssH;
      if (key !== sizedKey) { canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px'; sizedKey = key; }
      P.ox = layout.ox;
      P.oy = layout.oy + TOP_PAD / sc;

      const gap = lastT ? t - lastT : 0;
      const dt = Math.min(100, Math.max(0, gap)) / 1000;
      lastT = t;
      animT = reduced ? 0 : t;
      try { updateAgents(dt, t, gap > 2000); } catch (err) { warnOnce(err); }
      try { computeChat(animT); } catch (err) { warnOnce(err); }
      refreshAria();

      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, pw, ph);
      ctx.setTransform(dpr * sc, 0, 0, dpr * sc, 0, 0);
      noShadow();
      ctx.globalAlpha = 1;
      for (const f of layout.floors) safe(f);
      for (const f of layout.ground) safe(f);

      const list = layout.items.slice();
      for (const a of agents.values()) {
        const p = layout.byId.get(a.id);
        if (!p) continue;
        const f = pjr(a.x, a.y, 0), ck = p.k * P.cs;
        list.push({
          x0: a.x - 8, x1: a.x + 8, y0: a.y - 5, y1: a.y + 5, k: P.s > 0 ? a.x + a.y : a.y,
          sb: [f[0] - 22 * ck, f[1] - 70 * ck - 12, f[0] + 22 * ck, f[1] + 10], draw: () => drawAgent(a, p),
        });
      }
      for (const it of depthSort(list)) safe(it.draw);
      drawOverlays(cssW);
    }

    // Render loop: runs only while the page is visible. With reduced motion nothing animates, so it draws on demand
    // (a state change, resize, pointer move) plus a slow tick for the idle-to-lounge timer. When no agent is working
    // or walking the animation is light, so it is drawn at about 30 fps; otherwise at most about 60 fps.
    let rafId = 0, lastDraw = 0, dirty = true, lastBusy = true;
    function requestRender() {
      dirty = true;
      if (!rafId && !document.hidden) rafId = requestAnimationFrame(frame);
    }
    function renderNow() {
      if (document.hidden) { requestRender(); return; }
      dirty = true;
      if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      frame(performance.now());
    }
    function isBusy() {
      for (const a of agents.values()) if (a.dir !== 0 || a.st || a.status === 'working') return true;
      return false;
    }
    function frame(t) {
      rafId = 0;
      if (document.hidden) return;
      applyPending();
      if (reduced && !dirty) return;
      // at most ~60 fps even on a 120/144 Hz display, ~30 fps when nothing is moving
      if (!reduced && t - lastDraw < (lastBusy || dirty ? 15 : 30)) { rafId = requestAnimationFrame(frame); return; }
      dirty = false;
      lastDraw = t;
      try { render(t); } catch (err) { warnOnce(err); }
      lastBusy = isBusy();
      if (!reduced) rafId = requestAnimationFrame(frame);
    }
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
      } else {
        lastT = 0; // the gap while hidden must not become one huge animation step
        requestRender();
      }
    });
    setInterval(() => { if (reduced) requestRender(); }, 1000);

    function orderDesks(map) {
      const known = Object.keys(ROLES).filter((id) => hasOwn(map, id) && map[id]).map((id) => map[id]);
      const guests = Object.values(map).filter((d) => d && !hasOwn(ROLES, d.id)).sort((a, b) => String(a.id).localeCompare(String(b.id)));
      return known.concat(guests);
    }

    const logEl = document.getElementById('log');
    const logKey = (e) => (e ? e.t + '|' + e.desk + '|' + e.text : '');
    let lastLogKey = '';
    function renderLog(entries) {
      // The server sends the whole log each time, but normally only a few entries are new (oldest first).
      // Add just those on top and trim the tail; rebuild only when the previous newest entry is not found.
      entries = entries.filter(Boolean);
      const newest = logKey(entries[entries.length - 1]);
      if (newest === lastLogKey && logEl.childElementCount === entries.length) return;
      let from = 0;
      let incremental = false;
      if (lastLogKey) {
        for (let i = entries.length - 1; i >= 0; i--) {
          if (logKey(entries[i]) === lastLogKey) { from = i + 1; incremental = true; break; }
        }
      }
      if (!incremental) logEl.textContent = '';
      lastLogKey = newest;
      for (const e of entries.slice(from)) {
        const role = roleOf(e.desk);
        const li = document.createElement('li');
        const time = document.createElement('span');
        time.className = 'time';
        time.textContent = new Date(e.t).toLocaleTimeString();
        const who = document.createElement('span');
        who.className = 'who';
        who.style.borderLeftColor = role.color;
        who.textContent = role.label || 'Unknown';
        const text = document.createElement('span');
        text.textContent = String(e.text ?? '');
        li.append(time, who, text);
        logEl.prepend(li);
      }
      while (logEl.childElementCount > entries.length) logEl.lastElementChild.remove();
    }

    // ---------- accessibility: agent list and rate-limited announcements ----------

    const listEl = document.getElementById('agent-list');
    const announceEl = document.getElementById('announce');
    const listItems = new Map();
    const lastStatus = new Map();
    let announceQueue = [], announceTimer = 0, firstState = true;
    const ANNOUNCE_MS = 2500;

    function agentText(d) {
      const a = agents.get(d.id);
      return roleOf(d.id).label + ': ' + (d.status || 'unknown') + (a && a.loc !== 'at desk' ? ', ' + a.loc : '') + (d.activity ? ' - ' + d.activity : '');
    }

    function syncAgentList(list) {
      const keep = new Set();
      let prev = null;
      for (const d of list) {
        keep.add(d.id);
        let li = listItems.get(d.id);
        if (!li) {
          li = document.createElement('li');
          li.tabIndex = 0;
          li.dataset.id = d.id;
          li.addEventListener('focus', () => { focusId = li.dataset.id; requestRender(); });
          li.addEventListener('blur', () => { if (focusId === li.dataset.id) focusId = null; requestRender(); });
          listItems.set(d.id, li);
        }
        const txt = agentText(d);
        if (li.textContent !== txt) li.textContent = txt;
        // only move an item when it is out of order, so a focused item keeps focus
        const expected = prev ? prev.nextElementSibling : listEl.firstElementChild;
        if (expected !== li) listEl.insertBefore(li, expected);
        prev = li;
      }
      for (const [id, li] of listItems) {
        if (!keep.has(id)) { li.remove(); listItems.delete(id); if (focusId === id) focusId = null; }
      }
    }

    function queueAnnouncements(list) {
      const seen = new Set();
      for (const d of list) {
        seen.add(d.id);
        const st = d.status || 'unknown';
        const was = lastStatus.get(d.id);
        lastStatus.set(d.id, st);
        if (!firstState && was !== undefined && was !== st) announceQueue.push(roleOf(d.id).label + ' is ' + st);
      }
      for (const id of lastStatus.keys()) if (!seen.has(id)) lastStatus.delete(id);
      firstState = false;
      if (announceQueue.length && !announceTimer) flushAnnouncements();
    }

    function flushAnnouncements() {
      announceTimer = 0;
      if (!announceQueue.length) return;
      announceEl.textContent = announceQueue.slice(-3).join('. ');
      announceQueue = [];
      announceTimer = setTimeout(flushAnnouncements, ANNOUNCE_MS);
    }

    const connEl = document.getElementById('conn');
    const noticeEl = document.getElementById('notice');
    const restartBtn = document.getElementById('btn-restart');
    const stopBtn = document.getElementById('btn-stop');
    let restarting = false;

    function setStatus(text, live) {
      connEl.textContent = text;
      connEl.className = live ? 'on' : '';
    }

    function setButtons(enabled) {
      restartBtn.disabled = !enabled;
      stopBtn.disabled = !enabled;
    }

    function showNotice(text) {
      noticeEl.textContent = text;
      noticeEl.style.display = text ? 'block' : 'none';
    }

    async function sendControl(action) {
      setButtons(false);
      try {
        const res = await fetch('/control/' + action, { method: 'POST', headers: { 'X-Agent-Office': '1' } });
        if (!res.ok) throw new Error('HTTP ' + res.status);
      } catch (err) {
        console.error('Control request failed', err);
        showNotice('Failed to ' + action + ' the server.');
        setButtons(true);
        return false;
      }
      return true;
    }

    const RESTART_POLL_MS = 500;
    const RESTART_TIMEOUT_MS = 15000;

    restartBtn.addEventListener('click', async () => {
      if (!(await sendControl('restart'))) return;
      restarting = true;
      halted = true;
      source.close();
      setStatus('restarting...', false);
      // Poll until the new server answers, then reload to pick up any new index.html.
      const deadline = Date.now() + RESTART_TIMEOUT_MS;
      await new Promise((r) => setTimeout(r, RESTART_POLL_MS));
      while (Date.now() < deadline) {
        try {
          const res = await fetch('/state', { cache: 'no-store' });
          if (res.ok) return location.reload();
        } catch {
          // Server not up yet.
        }
        await new Promise((r) => setTimeout(r, RESTART_POLL_MS));
      }
      setStatus('offline', false);
      showNotice('Restart did not come back. Run start-office.ps1 or open a new Claude Code session, then reload this page.');
    });

    stopBtn.addEventListener('click', async () => {
      if (!(await sendControl('stop'))) return;
      halted = true;
      source.close();
      setStatus('stopped', false);
      showNotice('Server stopped. It starts again when you open a new Claude Code session or run start-office.ps1. Then reload this page.');
    });

    canvas.addEventListener('pointermove', (e) => {
      const r = canvas.getBoundingClientRect();
      mouse = { x: e.clientX - r.left, y: e.clientY - r.top };
      if (reduced) requestRender();
    });
    canvas.addEventListener('pointerleave', () => { mouse = null; if (reduced) requestRender(); });

    // Messages are kept and applied once per frame, so a burst of events costs one update.
    let pendingData = null;
    function applyPending() {
      if (pendingData === null) return;
      const data = pendingData;
      pendingData = null;
      try {
        const state = JSON.parse(data);
        renderLog(Array.isArray(state.log) ? state.log : []);
        desks = orderDesks(state.desks || {});
        deskMap = new Map(desks.map((d) => [d.id, d]));
        // Rebuild the layout only when the set of desks changes; status updates just feed the animation.
        const sig = desks.map((d) => d.id).join('|');
        if (sig !== idSig) { idSig = sig; layoutDirty = true; }
        syncAgents(desks);
        syncAgentList(desks);
        queueAnnouncements(desks);
        if (!desks.length) { ariaKey = ''; canvas.setAttribute('aria-label', 'Office floorplan. No agents yet.'); }
        dirty = true;
      } catch (err) {
        console.error('Invalid state message', err);
      }
    }

    // EventSource retries by itself while it is CONNECTING, but gives up for good (CLOSED) after an HTTP error.
    // Then reconnect with a growing delay; the server sends the full state on every new connection.
    let source = null, retryMs = 1000, retryTimer = 0, halted = false;
    function connect() {
      retryTimer = 0;
      if (halted) return;
      source = new EventSource('/events');
      source.onopen = () => {
        retryMs = 1000;
        setStatus('live', true);
        setButtons(true);
        showNotice('');
      };
      source.onerror = () => {
        if (!restarting && !halted) setStatus('reconnecting...', false);
        setButtons(false);
        if (source && source.readyState === EventSource.CLOSED && !halted && !retryTimer) {
          retryTimer = setTimeout(connect, retryMs);
          retryMs = Math.min(retryMs * 2, 30000);
        }
      };
      source.onmessage = (msg) => {
        pendingData = msg.data;
        requestRender();
      };
    }
    connect();

    requestRender();
  </script>
</body>

</html>

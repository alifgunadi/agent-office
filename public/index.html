<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Alifs Office</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%234b8df0'/%3E%3Cstop offset='1' stop-color='%232356c9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cpath d='M10 64c0-13 10-20 22-20s22 7 22 20z' fill='%23ffffff'/%3E%3Cpath d='M26 44l6 8 6-8z' fill='%23e5e7eb'/%3E%3Ccircle cx='32' cy='28' r='13' fill='%23ffe3cc'/%3E%3Cpath d='M19 27c0-10 6-15 13-15s13 5 13 15c-3-5-8-7-13-7s-10 2-13 7z' fill='%233f2a1d'/%3E%3Cg fill='none' stroke='%231f2937' stroke-width='2.2'%3E%3Ccircle cx='26.5' cy='29' r='4.6'/%3E%3Ccircle cx='37.5' cy='29' r='4.6'/%3E%3Cpath d='M31.1 29h1.8'/%3E%3C/g%3E%3Cpath d='M28.5 36.5q3.5 2.5 7 0' fill='none' stroke='%23b4574a' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/components.css">
  <link rel="stylesheet" href="/app.css">
</head>

<body>
  <header class="topbar">
    <h1>ALIF'S OFFICE</h1>
    <span id="conn" aria-live="polite">disconnected</span>
    <div class="controls">
      <button id="btn-restart" class="btn btn--secondary" type="button" title="Restart the server and reload this page">Restart</button>
      <button id="btn-stop" class="btn btn--danger-soft" type="button"
        title="Stop the server until a new Claude Code session or start-office.ps1">Stop</button>
    </div>
  </header>
  <div class="workspace">
    <main>
      <div id="notice" role="status"></div>
      <div class="stage-wrap">
        <div class="stage" tabindex="0"><canvas id="office" role="img"
            aria-label="Office floorplan with agent desks and their status"></canvas></div>
        <ul class="legend" id="legend" aria-label="Office zones"></ul>
        <section class="camera-card" id="camera" role="group" aria-label="Kamera">
          <div class="camera-head">
            <svg class="camera-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            <span class="camera-title">KAMERA</span>
            <output id="camera-readout" aria-live="polite">0° · 100%</output>
            <button class="icon-btn icon-btn--sm" id="camera-min" type="button" aria-expanded="true" aria-controls="camera-body" aria-label="Minimalkan kamera"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
          <div id="camera-body">
            <div class="camera-row">
              <button class="icon-btn icon-btn--lg" id="cam-left" type="button" aria-label="Putar kiri"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
              <div class="compass" aria-hidden="true">
                <svg id="camera-compass" viewBox="0 0 56 56"><path d="M28 10l6 16h-12z" fill="#d23c3c"/><path d="M28 46l-6-16h12z" fill="#9ca3af"/></svg>
              </div>
              <button class="icon-btn icon-btn--lg" id="cam-right" type="button" aria-label="Putar kanan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
            <div class="camera-row">
              <button class="icon-btn" id="cam-zoom-out" type="button" aria-label="Perkecil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
              <input type="range" id="cam-zoom" min="0" max="2" step="1" value="1" aria-label="Zoom" aria-valuetext="100%">
              <button class="icon-btn" id="cam-zoom-in" type="button" aria-label="Perbesar"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
            <div>
              <div class="camera-label" id="camera-walls-label">Dinding</div>
              <div class="tabs" id="camera-walls" role="radiogroup" aria-labelledby="camera-walls-label">
                <button class="tab" type="button" role="radio" aria-checked="false" data-walls="up" tabindex="-1">Naik</button>
                <button class="tab" type="button" role="radio" aria-checked="true" data-walls="cut">Potong</button>
                <button class="tab" type="button" role="radio" aria-checked="false" data-walls="down" tabindex="-1">Turun</button>
              </div>
            </div>
            <p class="camera-hint">Q/E putar · +/− zoom · 0 reset</p>
          </div>
        </section>
        <div class="minimap-card" hidden>
          <div class="camera-head"><span>PETA</span><span>Geser untuk pan</span></div>
          <canvas id="minimap" role="img" aria-label="Peta kantor: tarik untuk menggeser tampilan"></canvas>
        </div>
        <div class="me-card" id="me-card">
          <div class="avatar" aria-hidden="true">A</div>
          <div class="who">
            <div class="name">AlifGunadi</div>
            <div class="state" id="me-state">idle</div>
          </div>
          <div class="load">
            <div class="load-bar"><div class="load-fill" id="me-fill"></div></div>
            <div class="load-text" id="me-load">Tugas aktif 0 / 0</div>
          </div>
        </div>
      </div>
      <ul id="agent-list" class="sr-only" aria-label="Agents"></ul>
      <div id="announce" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    </main>
    <aside aria-label="Tasks and activity">
      <div class="tabs" role="tablist" aria-label="Side panel">
        <button class="tab" id="tab-tasks" role="tab" type="button" aria-selected="false" aria-controls="panel-tasks" tabindex="-1">Tasks <span class="badge badge--count" id="tasks-count" hidden>0</span></button>
        <button class="tab" id="tab-activity" role="tab" type="button" aria-selected="true" aria-controls="panel-activity">Activity</button>
      </div>
      <section class="panel" id="panel-tasks" role="tabpanel" aria-labelledby="tab-tasks" hidden>
        <div class="filters" role="group" aria-label="Filter tugas">
          <button class="chip" type="button" aria-pressed="true" data-filter="all">Semua</button>
          <button class="chip" type="button" aria-pressed="false" data-filter="active">Aktif</button>
          <button class="chip" type="button" aria-pressed="false" data-filter="waiting">Menunggu</button>
          <button class="chip" type="button" aria-pressed="false" data-filter="done">Selesai</button>
        </div>
        <p class="empty">Belum ada tugas aktif.</p>
      </section>
      <section class="panel" id="panel-activity" role="tabpanel" aria-labelledby="tab-activity">
        <ul id="log" role="log" aria-label="Activity log" aria-live="off"></ul>
      </section>
    </aside>
  </div>
  <script src="/js/roles-shared.js"></script>
  <script src="/js/roles.js"></script>
  <script src="/js/core.js"></script>
  <script src="/js/draw2d.js"></script>
  <script src="/js/projection.js"></script>
  <script src="/js/overlays.js"></script>
  <script src="/js/characters.js"></script>
  <script src="/js/agents.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/scene.js"></script>
  <script src="/js/log.js"></script>
  <script src="/js/a11y.js"></script>
  <script src="/js/chrome.js"></script>
  <script src="/js/camera.js"></script>
  <script src="/js/net.js"></script>
</body>

</html>
